version: '3.8'

services:
  # 1. MySQL 데이터베이스 컨테이너
  db:
    image: mysql:8.0
    container_name: alddle_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-alddle_db}
      MYSQL_USER: ${MYSQL_USER:-alddle_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "3306:3306" # 개발 편의를 위한 포트 바인딩 (운영 환경에서는 주석 처리 권장)
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alddle_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI 백엔드 & 크롤러 컨테이너
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alddle_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_ADMIN_UIDS: ${FIREBASE_ADMIN_UIDS:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/firebase/service-account.json}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ${FIREBASE_CREDENTIALS_DIR:-./secrets}:/run/firebase:ro
    networks:
      - alddle_network

networks:
  alddle_network:
    driver: bridge

volumes:
  mysql_data:
