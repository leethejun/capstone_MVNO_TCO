server {
    listen 80;
    server_name alddletco.bulldog-walker.com;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/alddle-tco/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://alddletco.bulldog-walker.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alddletco.bulldog-walker.com;

    ssl_certificate /etc/letsencrypt/live/alddletco.bulldog-walker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alddletco.bulldog-walker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 사용자 API는 백엔드의 Google 인증으로 보호한다.
    auth_basic off;

    root /srv/alddle-tco/current;
    index index.html;
    client_max_body_size 1m;
    access_log /var/log/nginx/alddle-tco-access.log;
    error_log /var/log/nginx/alddle-tco-error.log;

    location = /api {
        return 308 /api/;
    }
    location ^~ /api/ {
        # URI를 붙이지 않아 /api/... 경로를 그대로 보존한다.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Firebase ID 토큰을 백엔드로 전달한다.
        proxy_set_header X-Firebase-ID-Token $http_x_firebase_id_token;
        # 사용자 인증은 X-Firebase-ID-Token 헤더로 처리한다.
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
    # 서비스 워커와 정적 파일은 공개하고 사용자 API는 Google 인증을 유지한다.
    location = /firebase-messaging-sw.js {
        auth_basic off;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        auth_basic off;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/ {
        auth_basic off;
        try_files $uri =404;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
}
