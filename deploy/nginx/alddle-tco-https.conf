server {
    listen 80;
    server_name alddletco.bulldog-walker.com;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/alddle-tco/acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://alddletco.bulldog-walker.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name alddletco.bulldog-walker.com;

    ssl_certificate /etc/letsencrypt/live/alddletco.bulldog-walker.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alddletco.bulldog-walker.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Alddle TCO";
    auth_basic_user_file /etc/nginx/alddle-tco.htpasswd;

    root /srv/alddle-tco/current;
    index index.html;
    client_max_body_size 1m;
    access_log /var/log/nginx/alddle-tco-access.log;
    error_log /var/log/nginx/alddle-tco-error.log;

    location = /api {
        return 308 /api/;
    }
    location ^~ /api/ {
        # URI를 붙이지 않아 /api/... 경로를 그대로 보존한다.
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 사이트 접속 비밀번호를 백엔드에 전달하지 않는다.
        proxy_set_header Authorization "";
        proxy_read_timeout 60s;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
}
